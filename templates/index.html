{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Gallery</title>

    <style>

        body{
            background:black;
            font-family:Arial;
            color:white;
            text-align:center;
        }

        h1{
            color:#00ffff;
            margin-top:30px;
            font-size:45px;
        }

        .gallery{
            display:flex;
            flex-wrap:wrap;
            justify-content:center;
            gap:20px;
            margin-top:40px;
        }

        .gallery img{
            width:300px;
            height:300px;
            object-fit:contain;
            background:black;
            border-radius:20px;
            border:4px solid cyan;
            box-shadow:0px 0px 20px cyan;
            transition:0.5s;
        }

        .gallery img:hover{
            transform:scale(1.08);
            box-shadow:0px 0px 30px magenta;
        }

    </style>

</head>

<body>

    <h1>MY GALLERY</h1>

    <div class="gallery">

        <img src="{% static 'images/bhagya2.jpeg' %}">

        <img src="{% static 'images/bhagya3.jpeg' %}">

        <img src="{% static 'images/bhagya4.jpeg' %}">

    </div>

</body>
</html>

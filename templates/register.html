<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dark Neon Register</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(circle at top, #1f1147 0%, #090b1a 45%, #000 100%);
      color: #fff;
      overflow: hidden;
    }

    .glow {
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: rgba(0, 255, 255, 0.18);
      filter: blur(90px);
      top: 8%;
      left: 8%;
      animation: float 6s ease-in-out infinite;
    }

    .glow2 {
      position: absolute;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: rgba(255, 0, 200, 0.18);
      filter: blur(90px);
      bottom: 8%;
      right: 10%;
      animation: float 7s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
    }

    .register-box {
      position: relative;
      width: 100%;
      max-width: 460px;
      padding: 40px 32px;
      border-radius: 22px;
      background: rgba(10, 12, 28, 0.85);
      border: 1px solid rgba(0, 255, 255, 0.25);
      box-shadow:
        0 0 20px rgba(0, 255, 255, 0.15),
        0 0 40px rgba(255, 0, 200, 0.1);
      backdrop-filter: blur(12px);
      z-index: 2;
    }

    .register-box h1 {
      text-align: center;
      margin-bottom: 10px;
      font-size: 2rem;
      color: #00f7ff;
      text-shadow: 0 0 10px #00f7ff;
    }

    .register-box p {
      text-align: center;
      color: #cbd5e1;
      margin-bottom: 25px;
      font-size: 0.95rem;
    }

    .input-group {
      margin-bottom: 16px;
    }

    .input-group label {
      display: block;
      margin-bottom: 8px;
      color: #dbeafe;
      font-weight: 600;
    }

    .input-group input {
      width: 100%;
      padding: 14px 16px;
      border: none;
      outline: none;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: 1px solid rgba(0, 255, 255, 0.18);
      transition: 0.3s;
    }

    .input-group input::placeholder {
      color: #94a3b8;
    }

    .input-group input:focus {
      border-color: #00f7ff;
      box-shadow: 0 0 12px rgba(0, 247, 255, 0.35);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .terms {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 12px 0 20px;
      font-size: 0.92rem;
      color: #cbd5e1;
    }

    .terms a {
      color: #ff4fd8;
      text-decoration: none;
    }

    .terms a:hover {
      text-decoration: underline;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(90deg, #00f7ff, #ff4fd8);
      box-shadow: 0 0 15px rgba(0, 247, 255, 0.25);
      transition: 0.3s;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 22px rgba(255, 79, 216, 0.35);
    }

    .login-link {
      text-align: center;
      margin-top: 18px;
      color: #cbd5e1;
      font-size: 0.95rem;
    }

    .login-link a {
      color: #00f7ff;
      text-decoration: none;
      font-weight: 600;
    }

    .login-link a:hover {
      text-decoration: underline;
    }

    .error {
      display: none;
      margin-bottom: 14px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
      font-size: 0.92rem;
    }

    .success {
      display: none;
      margin-bottom: 14px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.35);
      color: #86efac;
      font-size: 0.92rem;
    }

    @media (max-width: 520px) {
      .register-box {
        max-width: 92%;
        padding: 34px 22px;
      }

      .row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="glow2"></div>

  <div class="register-box">
    <h1>Register</h1>
    <p>Create your account in the neon zone</p>

    <div class="error" id="errorBox">Please fill all fields correctly.</div>
    <div class="success" id="successBox">Registration form submitted successfully!</div>

    <form id="registerForm">
      <div class="row">
        <div class="input-group">
          <label for="firstName">First Name</label>
          <input type="text" id="firstName" placeholder="First name" />
        </div>

        <div class="input-group">
          <label for="lastName">Last Name</label>
          <input type="text" id="lastName" placeholder="Last name" />
        </div>
      </div>

      <div class="input-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email" />
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Create password" />
      </div>

      <div class="input-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Confirm password" />
      </div>

      <div class="terms">
        <input type="checkbox" id="terms" />
        <label for="terms">I agree to the <a href="#">terms and conditions</a></label>
      </div>

      <button type="submit" class="btn">Register</button>
    </form>

    <div class="login-link">
      Already have an account? <a href="{% url 'login' %}">Login</a>
    </div>
  </div>

  <script>
    const form = document.getElementById("registerForm");
    const errorBox = document.getElementById("errorBox");
    const successBox = document.getElementById("successBox");

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      const firstName = document.getElementById("firstName").value.trim();
      const lastName = document.getElementById("lastName").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const confirmPassword = document.getElementById("confirmPassword").value.trim();
      const terms = document.getElementById("terms").checked;

      if (!firstName || !lastName || !email || !password || !confirmPassword || !terms) {
        errorBox.style.display = "block";
        successBox.style.display = "none";
        return;
      }

      if (password !== confirmPassword) {
        errorBox.textContent = "Passwords do not match.";
        errorBox.style.display = "block";
        successBox.style.display = "none";
        return;
      }

      errorBox.style.display = "none";
      successBox.style.display = "block";
      form.reset();

      setTimeout(() => {
        successBox.style.display = "none";
      }, 3000);
    });
  </script>
</body>
</html>
